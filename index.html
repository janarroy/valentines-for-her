<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine? 🤍</title>
  <link rel="stylesheet" href="valentine.css" />
</head>
<body>

  <!-- Background photos -->
  <div id="photoBackground"></div>

  <!-- Soft white overlay -->
  <div id="whiteOverlay"></div>

  <!-- Main content -->
  <div class="container">

    <div class="sticker-wrapper">
      <img
        src="Images/Default.png"
        class="sticker"
        id="dogImage"
      />
    </div>

    <h1>Will you be my Valentine bug?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

  </div>

  <script src="valentine.js"></script>
</body>
</html>
