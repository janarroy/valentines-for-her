<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Will You Be My Valentine?</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="valentine.css" />
</head>
<body>
  <!-- photo background (hidden until activated) -->
  <div id="photoBackground" aria-hidden="true"></div>

  <!-- white translucent overlay that sits above the photos but below the UI -->
  <div id="whiteOverlay" aria-hidden="true"></div>

  <div class="container">
    <div class="sticker-wrapper">
      <img src="Images/Default.png" alt="dog sticker" class="sticker" id="dogImage" />
    </div>

    <h1>Will you be my Valentine bug?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
