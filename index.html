<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine? 💖</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <!-- Sticker area -->
    <div class="stickers" id="stickers">
      <!-- Default sticker (bear) -->
      <img src="images/bear.png" class="sticker show" />

      <!-- Dog stickers (hidden initially) -->
      <img src="images/dog1.png" class="sticker" />
      <img src="images/dog2.png" class="sticker" />
      <img src="images/dog3.png" class="sticker" />
    </div>

    <h1>Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
